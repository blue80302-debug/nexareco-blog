name: Auto Generate Post
on:
  # schedule 일시 중지 — AdSense 승인 후 재개
  # schedule:
  #   - cron: "0 0 * * 1,4"  # 주 2회 (월/목)
  workflow_dispatch:

jobs:
  refill-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Refill topic queue if low
        run: npm run refill
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Generate post from queue
        run: npm run generate
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ data/
          git diff --staged --quiet || git commit -m "Auto-generate new blog post"
          git push
