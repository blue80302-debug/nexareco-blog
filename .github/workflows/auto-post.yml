name: Auto Generate Post
on:
  schedule:
    - cron: "0 0 * * 3"
  workflow_dispatch:
    inputs:
      multi_lang:
        description: "Generate all languages (ko/en/ja/es)"
        type: boolean
        default: false

jobs:
  refill-and-generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci

      - name: Refill topic queue if low
        run: npm run refill
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Generate new post
        run: npm run generate
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
          MULTI_LANG: ${{ inputs.multi_lang == 'true' }}

      - name: Regenerate oldest low-quality post
        run: npm run regenerate
        env:
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add content/ data/ public/images/
          git diff --staged --quiet || git commit -m "Auto-generate new post + regenerate old post"
          git push
